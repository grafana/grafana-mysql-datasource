name: Scheduled Cloud end-to-end tests

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  playwright-cloud:
    uses: grafana/data-sources-ci-workflows/.github/workflows/playwright-cloud.yml@main
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      repo-secrets: |
        DS_INSTANCE_NAME=mysql:name
        DS_INSTANCE_URL=mysql:url
        DS_INSTANCE_PASSWORD=mysql:secure_password
        DS_INSTANCE_USERNAME=mysql:user
        DS_INSTANCE_DATABASE=mysql:json_database
